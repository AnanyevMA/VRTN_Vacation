# ==============================================================================
# Конфигурация Nginx для сервера 46.149.79.201 (совместная работа с WB FBS)
# Добавьте блоки location ниже внутрь существующего блока server {} от WB FBS
# ==============================================================================

# 1. Блокировка внешнего доступа к интерактивной документации Swagger / ReDoc / OpenAPI
location ~ ^/vacation/(docs|redoc|openapi\.json) {
    return 403;
}

# 2. Редирект /vacation -> /vacation/ для корректной работы относительных путей статики и API
location = /vacation {
    return 301 /vacation/;
}

# 3. Маршрут для Webhook мессенджера MAX (под префиксом /vacation/ во избежание коллизий с /api/ WB FBS)
location /vacation/api/chat/webhook {
    proxy_pass http://127.0.0.1:8005/api/chat/webhook;
    proxy_http_version 1.1;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /vacation;
}

# 4. Веб-интерфейс и REST API Планировщика отпусков (http://46.149.79.201/vacation/)
location /vacation/ {
    proxy_pass http://127.0.0.1:8005/;
    proxy_http_version 1.1;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /vacation;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

